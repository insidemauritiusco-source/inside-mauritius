name: Refresh Cyclone Watch marine data
on:
  workflow_dispatch:
  schedule:
    - cron: '21 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'cyclone/update-marine.py'
      - '.github/workflows/cyclone-marine.yml'
permissions:
  contents: write
concurrency:
  group: cyclone-marine-data
  cancel-in-progress: false
jobs:
  marine:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'eccodes>=2.38,<3' 'numpy>=1.26,<3'
      - run: python -m py_compile cyclone/update-marine.py
      - name: Fetch NOAA data
        id: fetch
        continue-on-error: true
        run: python cyclone/update-marine.py
      - name: Publish independently available datasets
        run: |
          git config user.name 'cyclone-marine[bot]'
          git config user.email 'cyclone-marine@users.noreply.github.com'
          for f in cyclone/waves.json cyclone/sst.json; do if test -f "$f"; then git add "$f"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh NOAA marine weather data'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report incomplete feed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
