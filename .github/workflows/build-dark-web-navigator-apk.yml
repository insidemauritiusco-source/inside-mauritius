name: Build Dark Web Navigator Android APK
on:
  push:
    branches:
      - build/dark-web-navigator-apk-20261113
      - feature/dark-web-navigator-v2-20261113
    paths:
      - "android/DarkWebNavigator/**"
      - ".github/workflows/build-dark-web-navigator-apk.yml"
  workflow_dispatch:
jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK (runner SDK)
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p android/DarkWebNavigator :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dark-web-navigator-v1-1-debug-apk
          path: android/DarkWebNavigator/app/build/outputs/apk/debug/app-debug.apk
