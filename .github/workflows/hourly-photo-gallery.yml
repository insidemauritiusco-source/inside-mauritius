name: Refresh approved regional photo gallery
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover candidate photographs for editorial review
        run: python scripts/discover_photo_candidates.py
      - name: Validate approved photographs and regenerate feed
        run: python scripts/refresh_photo_gallery.py
      - name: Commit refreshed feed only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-gallery-feed.json photo-gallery-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh approved regional photo gallery"
            git push
          fi
