name: Refresh Cyclone Watch ECMWF IFS
on:
  workflow_dispatch:
  schedule:
    - cron: '11 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'cyclone/update-ifs.py'
      - '.github/workflows/cyclone-ifs.yml'
permissions:
  contents: write
concurrency:
  group: cyclone-ifs-data
  cancel-in-progress: false
jobs:
  ifs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'eccodes>=2.42,<3' 'numpy>=1.26,<3' 'ecmwf-opendata>=0.3,<1'
      - run: python -m py_compile cyclone/update-ifs.py
      - run: python cyclone/update-ifs.py
      - name: Publish model data
        run: |
          git config user.name 'cyclone-ifs[bot]'
          git config user.email 'cyclone-ifs@users.noreply.github.com'
          git add cyclone/ifs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public ECMWF IFS forecast grid'
          git pull --rebase origin main
          git push origin HEAD:main
