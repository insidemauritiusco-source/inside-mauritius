name: Refresh Indian Ocean tropical systems
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - cyclone/update-indian-systems.py
      - .github/workflows/cyclone-indian-systems.yml
permissions:
  contents: write
concurrency:
  group: cyclone-indian-systems
  cancel-in-progress: false
jobs:
  systems:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile cyclone/update-indian-systems.py
      - run: python cyclone/update-indian-systems.py
      - name: Publish latest reports
        run: |
          git config user.name 'cyclone-systems[bot]'
          git config user.email 'cyclone-systems@users.noreply.github.com'
          git add cyclone/indian-systems.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh dated Indian Ocean tropical systems'
          git pull --rebase origin main
          git push origin HEAD:main
