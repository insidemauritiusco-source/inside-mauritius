name: Refresh world satellite motion
on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - cyclone/update-world-motion.py
      - .github/workflows/cyclone-world-motion.yml
permissions:
  contents: write
concurrency:
  group: cyclone-world-motion
  cancel-in-progress: false
jobs:
  imagery:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'netCDF4>=1.7,<2' 'Pillow>=10,<13'
      - run: python -m py_compile cyclone/update-world-motion.py
      - run: python cyclone/update-world-motion.py
      - name: Publish validated observation sequence
        run: |
          git config user.name 'cyclone-world-motion[bot]'
          git config user.email 'cyclone-world-motion@users.noreply.github.com'
          git add -A cyclone/world-motion
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh NOAA worldwide satellite animation'
          git pull --rebase origin main
          git push origin HEAD:main
