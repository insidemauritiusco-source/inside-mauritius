name: Synchronized news and integrated release review
on:
  push:
    branches: ['review/homepage-freshness-20261128']
    paths: ['.github/workflows/synchronized-integrated-review.yml']
permissions:
  contents: write
concurrency:
  group: synchronized-integrated-review
  cancel-in-progress: false
jobs:
  weather:
    if: github.ref == 'refs/heads/review/homepage-freshness-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feed: [marine, world-motion, icon, wind, ifs, indian-systems]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.feed == 'icon'
        run: sudo apt-get update && sudo apt-get install -y cdo
      - run: pip install 'numpy>=1.26,<3' 'netCDF4>=1.7,<2' 'Pillow>=10,<13' 'eccodes>=2.42,<3' 'ecmwf-opendata>=0.3,<1'
      - name: Retrieve fresh official source data and validate
        env:
          FEED: ${{ matrix.feed }}
        run: |
          set -o pipefail
          mkdir -p /tmp/sync-weather
          case "$FEED" in
            marine) rm -f cyclone/waves.json cyclone/sst.json ;;
            world-motion) rm -rf cyclone/world-motion ;;
            *) rm -f "cyclone/$FEED.json" ;;
          esac
          python -m py_compile "cyclone/update-$FEED.py"
          python "cyclone/update-$FEED.py"
          case "$FEED" in
            marine) test -s cyclone/waves.json && test -s cyclone/sst.json; cp cyclone/waves.json cyclone/sst.json /tmp/sync-weather/ ;;
            world-motion)
              python - <<'PY'
          import json, pathlib, datetime as dt
          from PIL import Image
          import numpy as np
          root=pathlib.Path('cyclone/world-motion')
          m=json.loads((root/'manifest.json').read_text())
          assert m['source']=='NOAA GMGSI LWIR' and m['bounds']==[-60,-180,60,180]
          assert 2<=len(m['frames'])<=6
          times=[]
          for f in m['frames']:
              t=dt.datetime.fromisoformat(f['time'])
              times.append(t)
              assert f['file']==t.strftime('%Y%m%d%H')+'.png'
              with Image.open(root/f['file']) as image:
                  a=np.array(image.convert('RGBA'))
              assert (a[:,:,3]>0).mean()>=.7
              assert np.std(a[:,:,0][a[:,:,3]>0])>1
          assert times==sorted(set(times))
          assert dt.timedelta(0)<=dt.datetime.now(dt.timezone.utc)-times[-1]<=dt.timedelta(hours=10)
          PY
              cp -r cyclone/world-motion /tmp/sync-weather/
              ;;
            indian-systems)
              python -c "import json; assert json.load(open('cyclone/indian-systems.json'))['status']=='ok'"
              cp cyclone/indian-systems.json /tmp/sync-weather/
              ;;
            *) test -s "cyclone/$FEED.json"; cp "cyclone/$FEED.json" /tmp/sync-weather/ ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: synchronized-weather-${{ matrix.feed }}
          path: /tmp/sync-weather/
          if-no-files-found: error
  complete:
    needs: weather
    if: github.ref == 'refs/heads/review/homepage-freshness-20261128' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/homepage-freshness-20261128
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - run: pip install 'kokoro==0.9.4' 'soundfile==0.13.1' 'langdetect==1.0.9'
      - uses: actions/download-artifact@v4
        with:
          pattern: synchronized-weather-*
          merge-multiple: true
          path: cyclone
      - name: Generate targeted headline recordings and validate synchronized coverage
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=scripts python - <<'PY'
          import json, pathlib, hashlib, datetime, re, subprocess
          from concurrent.futures import ThreadPoolExecutor
          from zoneinfo import ZoneInfo
          from generate_headline_audio import read_data, valid_mp3, valid_url, key, synthesize, PREFIX, VOICES
          from natural_voice_v3 import write_js
          root=pathlib.Path('.')
          languages={"source-6ee4ba50b3e88da5":"fr","source-4db2279b1aeb0eea":"fr","source-8eac94b5774edbf8":"fr","source-e32d6f586be29d57":"fr","source-ab8aa6013c1a9654":"fr","source-36855061d48a2223":"fr","source-43e85ee130d6691f":"fr","source-c044769c078c156a":"fr","source-ad5578621eba8a9a":"fr","source-bdd82be16ba7fafd":"en"}
          targets=set(languages)
          feed=read_data(root/'newsroom-data.js')
          rows={r['id']:r for r in feed}
          assert len(targets)==10 and targets <= rows.keys()
          assert len(feed)==51 and all(r['title']!='Recherche' for r in feed)
          names=('headline-audio-data.js','post-audio-data.js','summary-audio-data.js','audio-bulletins.js')
          prior={name:read_data(root/name) for name in names}
          old_files={p:hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'audio').rglob('*') if p.is_file()}
          def playable(r):
              return r.get('engine')=='Kokoro' and r.get('generated') is True and r.get('language') in VOICES
          def matches(s,r):
              return playable(r) and s['title']==r.get('title') and (s['id']==r.get('id') or s['sourceUrl']==r.get('sourceUrl'))
          records=list(prior[names[0]])
          previous=records+prior[names[1]]+prior[names[2]]
          pipelines={}
          added=[]
          for row in feed:
              if row['id'] not in targets: continue
              if any(matches(row,r) for r in previous): continue
              title,url=row['title'],row['sourceUrl']
              assert valid_url(url) and title.strip()
              lang=languages[row['id']]; voice=VOICES[lang][1]
              rel='audio/headline-'+key(title,url,voice)+'.mp3'
              p=root/rel
              if p.exists():
                  assert valid_mp3(p), 'Existing file invalid; refusing overwrite: '+rel
              else:
                  synthesize(title,lang,p,pipelines)
              assert valid_mp3(p)
              record=dict(title=title,sourceUrl=url,audioUrl=rel,voice=voice,language=lang,engine='Kokoro',generated=True,lastSeen=datetime.datetime.now(ZoneInfo('Indian/Mauritius')).date().isoformat(),legacyV2=False)
              added.append(record)
          records.extend(added)
          assert records[:len(prior[names[0]])]==prior[names[0]]
          combined=records+prior[names[1]]+prior[names[2]]
          missing=[r['id'] for r in feed if not any(matches(r,a) for a in combined)]
          assert not missing, missing
          for p,digest in old_files.items():
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest, str(p)
          files={r['audioUrl'] for r in records+prior[names[1]]+prior[names[2]]+prior[names[3]] if str(r.get('audioUrl','')).startswith('audio/')}
          with ThreadPoolExecutor(max_workers=8) as pool:
              assert all(pool.map(lambda p:valid_mp3(root/p),sorted(files)))
          write_js(root/names[0],PREFIX,records)
          digest=hashlib.sha256((root/names[0]).read_bytes()).hexdigest()[:16]
          for name in ('index.html','live-updates.html'):
              p=root/name
              text=p.read_text()
              text,n=re.subn(r'(src="headline-audio-data\.js)(?:\?v=[^"]*)?"',lambda m:m[1]+'?v='+digest+'"',text)
              assert n==1,name
              p.write_text(text)
          report={'feed_entries':len(feed),'eligible_entries':len(feed),'eligible_with_audio':len(feed),'added':len(added),'excluded_navigation':3,'excluded_promotional':1,'existing_audio_files_preserved':len(old_files),'validated_audio_files':len(files),'bulletins_preserved':len(prior[names[3]])}
          pathlib.Path('/tmp/mauritius-voice-review.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Verify approved photo metadata and news source links
        run: |
          python - <<'PY'
          import json, pathlib
          from urllib.parse import urlsplit
          root=pathlib.Path('.')
          a=json.loads((root/'photo-gallery-approved.json').read_text())['items']
          b=json.loads((root/'photo-gallery-feed.json').read_text())['items']
          assert len(a)==len(b)==4
          for x in a:
              y=next(y for y in b if x['source_url']==y['source_url'])
              for k in ('credit','license','license_url','photo_date','archive','approved','modification_note'):
                  assert x[k]==y[k], k
          news=json.loads((root/'newsroom-data.js').read_text().split('=',1)[1].strip().rstrip(';'))
          for s in news:
              u=urlsplit(s['sourceUrl'])
              assert u.scheme=='https' and u.hostname and not u.username and s['sourceName']
              img=s.get('image','')
              if img and not img.startswith('https://'): assert (root/img).is_file()
          PY
          python -m py_compile scripts/auto_news.py scripts/natural_voice_v3.py scripts/refresh_photo_gallery.py
          for f in app.js natural-post-audio.js live-updates.js media-repair.js photo-gallery.js; do node --check "$f"; done
      - name: Verify actual website audio lookup and playback
        run: |
          node --check headline-audio-data.js
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/voice-http.log 2>&1 &
          node <<'JS'
          const {chromium,devices}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            try{
              for(const cfg of [{viewport:{width:1440,height:900}},devices['Galaxy S9+'],{viewport:{width:384,height:832},isMobile:true,hasTouch:true}]){
                const page=await browser.newPage(cfg);
                await page.route('**/*',r=>r.request().url().startsWith('http://127.0.0.1:8765/')?r.continue():r.abort());
                await page.goto('http://127.0.0.1:8765/index.html');
                await page.waitForFunction(()=>!!window.INSIDE_MAURITIUS_NATURAL_POST_AUDIO);
                const missing=await page.evaluate(()=>window.INSIDE_MAURITIUS_NEWSROOM_ARTICLES.filter(s=>!window.INSIDE_MAURITIUS_NATURAL_POST_AUDIO.find(s)).map(s=>s.id));
                if(missing.length)throw Error('Website audio lookup failed: '+missing.join(','));
                await page.locator('#imDashboardStart').click();
                await page.waitForFunction(()=>document.querySelector('#imDashboardPlayer').currentTime>0.1);
                await page.locator('#imDashboardNext').click();
                await page.locator('#imDashboardStop').click();
                await page.waitForFunction(()=>document.querySelector('#imDashboardPlayer').paused);
                if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw Error('Homepage horizontal overflow');
                await page.goto('http://127.0.0.1:8765/live-updates.html');
                await page.locator('#v3Bulletins button').filter({hasText:'retrospective'}).click();
                await page.waitForFunction(()=>document.querySelector('#v3QueueAudio').currentTime>0.1);
                await page.locator('#v3Stop').click();
                await page.goto('http://127.0.0.1:8765/photo-gallery.html');
                await page.locator('#gallery article').nth(3).waitFor();
                if(await page.locator('#gallery article').count()!==4 || await page.locator('#gallery article a').count()!==8)throw Error('Approved archive gallery changed');
                if(await page.locator('#gallery article').filter({hasText:'Archive photograph'}).count()!==4)throw Error('Missing archive labels');
                await page.locator('#gallery article button').first().click();
                await page.locator('#viewer[open]').waitFor();
                if(await page.locator('#credit a').count()!==2)throw Error('Attribution missing');
                await page.locator('#close').click();
                for(const path of ['wind.json','ifs.json','icon.json','waves.json','sst.json','indian-systems.json','world-motion/manifest.json']){
                  const response=await page.request.get('http://127.0.0.1:8765/cyclone/'+path);
                  if(!response.ok())throw Error('Weather file unavailable: '+path);
                  await response.json();
                }
                await page.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: mauritius-voice-coverage-report
          path: /tmp/mauritius-voice-review.json
      - name: Commit validated additions to review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/review/homepage-freshness-20261128
          git fetch origin review/homepage-freshness-20261128
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audio/ headline-audio-data.js index.html live-updates.html cyclone/wind.json cyclone/ifs.json cyclone/icon.json cyclone/waves.json cyclone/sst.json cyclone/indian-systems.json cyclone/world-motion/
          test -z "$(git diff --cached --name-only --diff-filter=D)"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install synchronized and regression-tested audio and official weather snapshots on review branch'
          git push origin HEAD:refs/heads/review/homepage-freshness-20261128
