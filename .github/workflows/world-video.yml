name: Produce original global perspective intro video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_world_intro.py'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate original six-second MP4
        run: python3 scripts/build_world_intro.py
      - name: Publish generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/global-perspective.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Publish original global perspective video"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep 3
          done
