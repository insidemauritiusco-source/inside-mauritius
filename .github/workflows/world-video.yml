name: Preview original global perspective intro video

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-video-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate and decode-test MP4 and WebM
        run: python3 scripts/build_world_intro.py
      - name: Upload videos for review only
        uses: actions/upload-artifact@v4
        with:
          name: inside-mauritius-world-video-preview
          path: |
            media/global-perspective.mp4
            media/global-perspective.webm
          if-no-files-found: error
          retention-days: 7
