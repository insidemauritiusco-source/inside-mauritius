name: Produce original global perspective intro video

on:
  workflow_dispatch:
  push:
    branches: [main, fix/world-news-video-browser-playback-20261112]
    paths:
      - 'scripts/build_world_intro.py'

permissions:
  contents: write

concurrency:
  group: original-world-intro-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate and decode-test MP4 and WebM
        run: python3 scripts/build_world_intro.py
      - name: Commit validated video files back to the triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/global-perspective.mp4 media/global-perspective.webm
          if git diff --cached --quiet; then
            echo "Validated media is already up to date"
            exit 0
          fi
          git commit -m "Rebuild browser-compatible MP4 and WebM world intro"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 3
          done
          exit 1
