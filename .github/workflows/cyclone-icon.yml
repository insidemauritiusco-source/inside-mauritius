name: Refresh Cyclone Watch DWD ICON
on:
  workflow_dispatch:
  schedule:
    - cron: '53 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'cyclone/update-icon.py'
      - '.github/workflows/cyclone-icon.yml'
permissions:
  contents: write
concurrency:
  group: cyclone-icon-data
  cancel-in-progress: false
jobs:
  icon:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cdo
      - run: pip install 'eccodes>=2.42,<3' 'numpy>=1.26,<3' 'netCDF4>=1.7,<2'
      - run: python -m py_compile cyclone/update-icon.py
      - run: python cyclone/update-icon.py
      - name: Publish ICON grid
        run: |
          git config user.name 'cyclone-icon[bot]'
          git config user.email 'cyclone-icon@users.noreply.github.com'
          git add cyclone/icon.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public DWD ICON forecast grid'
          git pull --rebase origin main
          git push origin HEAD:main
